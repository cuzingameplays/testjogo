services:
  - type: web
    name: dubshow-online
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DUBSHOW_RUNTIME_DIR
        value: /tmp/dubshow_runtime
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
